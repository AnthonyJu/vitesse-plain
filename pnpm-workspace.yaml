shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@playwright/test@1.65.1'
  - playwright-core@1.65.1
  - playwright@1.65.1
